[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Grounded RAG over financial filings: ingestion, retrieval, answering and evaluation"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "pdfplumber==0.11.10",
    "tokenizers>=0.21,<0.24",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "fastapi==0.156.3",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
ui = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
