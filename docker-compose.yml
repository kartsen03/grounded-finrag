# Local stack for grounded-finrag. Ports bind to 127.0.0.1 only.
# Credentials default to dev-only values; override them in .env (see .env.example).
#   docker compose up -d                  # infrastructure only: PostgreSQL + pgvector, Redis
#   docker compose --profile app up -d    # + model-server (CPU), llm-gateway, rag-service
# Ollama runs on the host; set OLLAMA_HOST=0.0.0.0 there so containers can reach it.
# Networks enforce the design: only the gateway can reach the model server.
name: grounded-finrag

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: finrag
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrag-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag -d finrag"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-finrag-dev}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-finrag-dev}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  model-server:
    profiles: [app]
    build: ./model-server
    volumes:
      - hfcache:/models
    networks: [models]

  llm-gateway:
    profiles: [app]
    build: ./llm-gateway
    environment:
      GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/finrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrag-dev}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-finrag-dev}
      MODEL_SERVER_URL: http://model-server:8090
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      model-server: { condition: service_started }
    networks: [data, models, app]

  rag-service:
    profiles: [app]
    build: ./rag-service
    environment:
      GATEWAY_URL: http://llm-gateway:8080
      FINRAG_PG_DSN: postgresql://finrag:${POSTGRES_PASSWORD:-finrag-dev}@postgres:5432/finrag
    volumes:
      - ./data:/repo/data
      - ./results:/repo/results
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      llm-gateway: { condition: service_started }
    networks: [data, app]

networks:
  data:
  models:
  app:

volumes:
  pgdata:
  redisdata:
  hfcache:
